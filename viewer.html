<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Koleksi 3D — Museum Brawijaya</title>
 <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.3.1/model-viewer.min.js"></script>
  <style>
    :root { --accent:#7a1f1f; }
    * { box-sizing:border-box; }
    html, body { margin:0; height:100%; background:#f4f1ea;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color:#1a1a1a; }
    header { display:flex; align-items:center; gap:10px; padding:12px 16px; background:var(--accent); color:#fff; }
    header a { color:#fff; text-decoration:none; font-size:1.4rem; line-height:1; }
    header h1 { margin:0; font-size:1.15rem; }
    model-viewer { width:100%; height:62vh; background:#e7e2d8; --poster-color:#e7e2d8; }
    main { padding:12px 16px 24px; max-width:760px; margin:0 auto; }
    .hint { text-align:center; font-size:1.05rem; color:#444; margin:14px 0 18px; }
    .row { display:flex; gap:10px; flex-wrap:wrap; justify-content:center; }
    button, .arbtn { font-size:1.05rem; padding:14px 20px; border:0; border-radius:12px;
      background:var(--accent); color:#fff; min-height:48px; cursor:pointer; }
    .fallback { display:none; background:#fff; border-radius:12px; padding:18px; text-align:center; }
    .fallback img { max-width:100%; border-radius:8px; }
  </style>
</head>
<body>
  <header>
    <a href="index.html" aria-label="Kembali">&#8592;</a>
    <h1 id="titlebar">Koleksi 3D</h1>
  </header>

  <model-viewer id="mv"
      alt="Model 3D aset museum"
      camera-controls touch-action="pan-y"
      auto-rotate rotation-per-second="18deg"
      shadow-intensity="1" exposure="1"
      ar ar-modes="webxr scene-viewer quick-look"
      camera-orbit="0deg 75deg auto" min-field-of-view="20deg">
    <button class="arbtn" slot="ar-button">Lihat dalam AR</button>
  </model-viewer>

  <main>
    <p class="hint">Geser jari untuk memutar &bull; Cubit untuk memperbesar &bull; Ketuk dua kali untuk reset</p>
    <div class="row">
      <button id="reset">Kembalikan Posisi</button>
      <button id="rotate">Putar Otomatis: ON</button>
    </div>

    <div class="fallback" id="fallback">
      <p>Perangkat tidak mendukung tampilan 3D.</p>
      <img id="fallbackImg" alt="Gambar aset" />
    </div>
  </main>

  <script>
    const params = new URLSearchParams(location.search);
    const id   = params.get("id")   || "A01";
    const name = params.get("name") || ("Aset " + id);
    const base = params.get("base") || "models";

    document.getElementById("titlebar").textContent = name;
    document.title = name + " — Museum Brawijaya";

    const mv = document.getElementById("mv");
    mv.setAttribute("ios-src", `${base}/${id}.usdz`);
    mv.setAttribute("poster", `${base}/${id}.jpg`);
    document.getElementById("fallbackImg").src = `${base}/${id}.jpg`;

    // coba beberapa lokasi (folder models/ atau root) agar tahan beda struktur
    const candidates = [...new Set([`${id}.glb`, `${base}/${id}.glb`, `models/${id}.glb`])];
    let ci = 0;
    function showFallback() {
      document.getElementById("fallback").style.display = "block";
      mv.style.display = "none";
    }
    function loadNext() {
      if (ci >= candidates.length) { showFallback(); return; }
      mv.setAttribute("src", candidates[ci++]);
    }
    mv.addEventListener("error", loadNext);
    loadNext();

    let auto = true;
    document.getElementById("reset").addEventListener("click", () => {
      mv.cameraOrbit = "0deg 75deg auto";
      mv.fieldOfView = "auto";
    });
    document.getElementById("rotate").addEventListener("click", (e) => {
      auto = !auto;
      mv.autoRotate = auto;
      e.target.textContent = "Putar Otomatis: " + (auto ? "ON" : "OFF");
    });

    const arBtn = document.querySelector(".arbtn");
  </script>
</body>
</html>
